<!DOCTYPE html>
<html>
<head>
    <title>Quiz Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f0df;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: rgba(255,255,255,0.92);
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #5b4636;
        }

       textarea {
width: 100%;
height:250px;
padding: 15px;
box-sizing: border-box;
borer: 1px solid #c8b8a5;
border-radius: 12px;
font-size: 16px;
resize: vertical;
outline: none;
}
 textarea:focus {
    border-color: #8d6e63;
}


        button {
            display: block;
            margin: 20px auto;
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            background: #6b4f3a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4f392a;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #fffaf0;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #6b4f3a;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Quiz Generator</h1>

    <form method="POST" action="{{ url_for('quiz_generator') }}">

        <textarea name="text" placeholder="Paste your study notes here...">{{ entered_text }}</textarea>

        <button type="submit">Generate Quiz</button>

    </form>

    {% if quiz %}
    <div class="result">
        <h2>Generated Quiz</h2>
        {{ quiz }}
    </div>
    {% endif %}

    <div class="back">
        <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
    </div>

</div>

</body>
</html>
