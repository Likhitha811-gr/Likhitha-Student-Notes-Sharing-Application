
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            margin: 0;
            padding: 30px;
            color: #29234b;
        }

        h1 {
            color: #4b3290;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 16px;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            min-width: 200px;
            flex: 1;
            box-shadow: 0 2px 10px #00000012;
        }

        .card h3 {
            margin: 0 0 15px;
            color: #4b3290;
            font-size: 17px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #6941c6;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }

        .links a {
            display: inline-block;
            padding: 13px 20px;
            background: #6941c6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .links a:hover {
            background: #4b3290;
        }

        .links a.logout {
            background: #555;
        }

        .links a.logout:hover {
            background: #333;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }

            .cards {
                flex-direction: column;
            }

            .links {
                flex-direction: column;
            }

            .links a {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <h1>Admin Dashboard</h1>

    <p>Welcome, {{ session.get('user_name', 'Admin') }}</p>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <div class="number">{{ total_students }}</div>
        </div>

        <div class="card">
            <h3>Total Notes</h3>
            <div class="number">{{ total_notes }}</div>
        </div>

        <div class="card">
            <h3>Shared Quizzes</h3>
            <div class="number">{{ total_quizzes }}</div>
        </div>

    </div>

    <div class="links">

        <a href="{{ url_for('admin_students') }}">
            Manage Students
        </a>

        <a href="{{ url_for('admin_notes') }}">
            Manage Notes
        </a>

        <a href="{{ url_for('admin_quizzes') }}">
            Manage Quizzes
        </a>

        <a class="logout" href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</body>
</html>
