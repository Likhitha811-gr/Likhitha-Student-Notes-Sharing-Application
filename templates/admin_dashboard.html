<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f3ff; margin: 0; padding: 30px; color: #29234b; }
        h1 { color: #4b3290; }
        .cards { display: flex; flex-wrap: wrap; gap: 18px; margin: 25px 0; }
        .card { background: white; padding: 22px; border-radius: 12px; min-width: 180px; box-shadow: 0 2px 10px #00000012; }
        .number { font-size: 30px; font-weight: bold; color: #6941c6; }
        .links { display: flex; flex-wrap: wrap; gap: 12px; }
        a { display: inline-block; padding: 12px 18px; background: #6941c6; color: white; text-decoration: none; border-radius: 7px; }
        a.logout { background: #555; }
    </style>
</head>
<body>
    <h1>Admin Dashboard</h1>
    <p>Welcome, {{ session.get('user_name', 'Admin') }}</p>
    <div class="cards">
        <div class="card"><div>Total Students</div><div class="number">{{ total_students }}</div></div>
        <div class="card"><div>Total Notes</div><div class="number">{{ total_notes }}</div></div>
        <div class="card"><div>Shared Quizzes</div><div class="number">{{ total_quizzes }}</div></div>
    </div>
    <div class="links">
        <a href="{{ url_for('admin_students') }}">Manage Students</a>
        <a href="{{ url_for('admin_notes') }}">Manage Notes</a>
        <a href="{{ url_for('admin_quizzes') }}">Manage Quizzes</a>
        <a class="logout" href="{{ url_for('logout') }}">Logout</a>
    </div>
</body>
</html>
