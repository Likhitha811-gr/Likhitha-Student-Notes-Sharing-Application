<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(255,248,230,0.82),
                    rgba(255,248,230,0.82)
                ),
                url("/static/image.jpeg");

            background-size: cover;
            background-position: center;
            min-height: 100vh;

            color: #4b3b2a;
        }

        .box {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;

            background: rgba(255,250,240,0.95);
            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #5d4933;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #c7b69a;
            border-radius: 10px;

            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8b6f47;
        }

        .buttons {
            text-align: center;
            margin-top: 10px;
        }

        button,
        a {
            display: inline-block;

            padding: 11px 18px;
            margin: 10px 5px 0;

            border: none;
            border-radius: 10px;

            text-decoration: none;
            color: white;

            cursor: pointer;
            font-size: 14px;
        }

        button {
            background: #6d7c59;
        }

        button:hover {
            background: #596747;
        }

        .back {
            background: #8b6f47;
        }

        .back:hover {
            background: #735b39;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>✏️ Edit Profile</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ user[1] }}"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ user[2] }}"
            required
        >

        <div class="buttons">

            <button type="submit">
                💾 Save Changes
            </button>

            <a
                class="back"
                href="{{ url_for('profile') }}"
            >
                ⬅️ Back to Profile
            </a>

        </div>

    </form>

</div>

</body>
</html>
