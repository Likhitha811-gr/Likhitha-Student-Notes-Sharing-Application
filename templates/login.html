<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5eee5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .login-card {
            width: 100%;
            max-width: 390px;
            background: #fffdf9;
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 10px 30px rgba(80, 50, 25, 0.15);
        }

        .logo {
            width: 55px;
            height: 55px;
            background: #f1e4d2;
            border-radius: 15px;
            margin: 0 auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }

        .app-name {
            text-align: center;
            color: #4c2d1b;
            font-size: 23px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #9a8d82;
            margin-top: 5px;
            font-size: 13px;
        }

        .welcome {
            color: #3f2b1d;
            font-size: 23px;
            font-weight: bold;
            margin-top: 22px;
            margin-bottom: 8px;
        }

        .description {
            color: #958a80;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 17px;
        }

        label {
            display: block;
            color: #514238;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            height: 43px;
            border: 1px solid #ddd5cc;
            border-radius: 9px;
            background: #eaf2ff;
            padding: 0 13px;
            font-size: 14px;
            color: #40352e;
            outline: none;
        }

        input:focus {
            border-color: #8b5835;
        }

        .password-input {
            padding-right: 45px;
        }

        .eye {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #765d4a;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 9px;
            background: #8b5734;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 2px;
        }

        .login-btn:hover {
            background: #75472a;
        }

        .create-account {
            text-align: center;
            margin-top: 18px;
            color: #9a9088;
            font-size: 13px;
        }

        .create-account a {
            color: #8b5734;
            font-weight: bold;
            text-decoration: none;
        }

        .line {
            height: 1px;
            background: #e5ddd4;
            margin-top: 18px;
        }

        .footer {
            text-align: center;
            color: #aaa098;
            font-size: 11px;
            line-height: 1.5;
            margin-top: 13px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 23px 20px;
            }
        }

        @media (max-height: 600px) {
            body {
                align-items: flex-start;
            }

            .login-card {
                margin: 5px auto;
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .welcome {
                margin-top: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">📚</div>

        <div class="app-name">Student Notes</div>
        <div class="subtitle">Sharing Application</div>

        <h1 class="welcome">Welcome Back!</h1>

        <p class="description">
            Login to continue your learning journey and access your
            study materials.
        </p>

        <form action="{{ url_for('login') }}" method="POST">

            <label for="email">Email Address</label>

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <label for="password">Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Enter your password"
                    required
                >

                <span class="eye"
                      onclick="togglePassword()"
                      id="eye">👁</span>

            </div>

            <button type="submit" class="login-btn">
                Login to Account →
            </button>

        </form>

        <div class="create-account">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </div>

        <div class="line"></div>

        <div class="footer">
            Student Notes Sharing Application<br>
            Learn together, grow together ♡
        </div>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eye = document.getElementById("eye");

            if (password.type === "password") {
                password.type = "text";
                eye.textContent = "🙈";
            } else {
                password.type = "password";
                eye.textContent = "👁";
            }
        }
    </script>

</body>
