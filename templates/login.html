<!DOCTYPE html>
<html>
<head>
    <title>Login - Student Notes Sharing Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5eee5;
            margin: 0;
            padding: 0;
        }

        .login-container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #704b32;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4b3829;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d6c2ad;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #9b7050;
        }

        /* Password eye icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 35%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            padding: 0;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #8b6042;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button[type="submit"]:hover {
            background: #704b32;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #8b6042;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Student Login</h2>

        <form method="POST" action="/login">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword()"
                    id="eyeButton"
                    aria-label="Show password"
                >👁</button>
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eyeButton = document.getElementById("eyeButton");

            if (password.type === "password") {
                password.type = "text";
                eyeButton.innerHTML = "🙈";
                eyeButton.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                eyeButton.innerHTML = "👁";
                eyeButton.setAttribute("aria-label", "Show password");
            }
        }
    </script>

</body>
</html>
