
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Notes Sharing Application</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(rgba(248,243,233,.72), rgba(248,243,233,.72)),
                url("/static/study-bg.jpg") center/cover fixed no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 18px;
            color: #493322;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 251, 244, .97);
            padding: 34px;
            border: 1px solid #eadbc7;
            border-radius: 20px;
            box-shadow: 0 14px 40px rgba(83, 57, 33, .13);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            font-size: 40px;
            margin-bottom: 7px;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            color: #70472b;
        }

        .brand p {
            margin: 7px 0 0;
            font-size: 14px;
            color: #8b7865;
        }

        h2 {
            margin: 0 0 7px;
            font-size: 23px;
        }

        .subtitle {
            margin: 0 0 22px;
            font-size: 14px;
            color: #887765;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #dfcfbb;
            border-radius: 10px;
            background: #fffdf9;
            color: #493322;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #9b6b43;
            box-shadow: 0 0 0 3px rgba(155, 107, 67, .12);
        }

        /* Password eye icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            padding: 3px;
            color: #70472b;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin-top: 18px;
            color: #806e5b;
            font-size: 13px;
            line-height: 1.5;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #815333;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #694126;
        }

        .bottom-text {
            margin: 21px 0 0;
            text-align: center;
            font-size: 14px;
            color: #806e5b;
        }

        a {
            color: #815333;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 10px 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #f5e5d8;
            color: #78452e;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <main class="register-card">
        <div class="brand">
            <div class="brand-icon">📚</div>
            <h1>Student Notes</h1>
            <p>Sharing Application</p>
        </div>

        <h2>Create Your Account</h2>
        <p class="subtitle">Join the student learning community.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-row">
                <div>
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name"
                           placeholder="First name" autocomplete="given-name" required>
                </div>

                <div>
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name"
                           placeholder="Last name" autocomplete="family-name" required>
                </div>
            </div>

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username" autocomplete="username" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" autocomplete="email" required>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password"
                       placeholder="Create a password" autocomplete="new-password"
                       minlength="12" required>
                <button type="button" class="toggle-password"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">👁</button>
            </div>

            <label for="confirm_password">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="Re-enter your password"
                       autocomplete="new-password" minlength="12" required>
                <button type="button" class="toggle-password"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show confirm password">👁</button>
            </div>

            <label class="terms">
                <input type="checkbox" name="terms" required>
                <span>I agree to use this application responsibly and share study materials respectfully.</span>
            </label>

            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </main>

    <script>
        function togglePassword(inputId, button) {
            const password = document.getElementById(inputId);

            if (password.type === "password") {
                password.type = "text";
                button.innerHTML = "🙈";
                button.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                button.innerHTML = "👁";
                button.setAttribute("aria-label", "Show password");
            }
        }

        const form = document.querySelector("form");

        form.addEventListener("submit", function (event) {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (password !== confirmPassword) {
                event.preventDefault();
                alert("Passwords do not match. Please try again.");
            }
        });
    </script>
</body>
</html>
