<!DOCTYPE html>
<html>
<head>
    <title>Manage Notes</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f3ff; padding: 30px; color: #29234b; }
        h1 { color: #4b3290; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #6941c6; color: white; }
        a { color: #4b3290; }
        .back { display: inline-block; margin-top: 20px; padding: 10px 15px; background: #6941c6; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Manage Notes</h1>
    <table>
        <tr><th>ID</th><th>Title</th><th>Subject</th><th>Uploaded By</th><th>Upload Date</th><th>File</th></tr>
        {% for note in notes %}
        <tr>
            <td>{{ note.id }}</td><td>{{ note.title }}</td><td>{{ note.subject }}</td>
            <td>{{ note.uploaded_by or 'Unknown' }}</td><td>{{ note.uploaded_date }}</td>
            <td><a href="{{ url_for('view', filename=note.filename) }}">View</a> |
                <a href="{{ url_for('download', filename=note.filename) }}">Download</a></td>
        </tr>
        {% else %}
        <tr><td colspan="6">No notes available.</td></tr>
        {% endfor %}
    </table>
    <a class="back" href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
</body>
</html>
