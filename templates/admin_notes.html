
<!DOCTYPE html>
<html>
<head>
    <title>Manage Notes - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            margin: 0;
            padding: 30px;
            color: #29234b;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #4b3290;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            background: #6941c6;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #4b3290;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000012;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #6941c6;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #faf8ff;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .table-container {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <div>
            <h1>Manage Notes</h1>
            <p class="subtitle">
                View and manage all student uploaded notes.
            </p>
        </div>

        <a href="{{ url_for('admin_dashboard') }}"
           class="back-btn">
            Back to Dashboard
        </a>
    </div>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Note Title</th>
                    <th>Uploaded By</th>
                    <th>Filename</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for note in notes %}
                <tr>
                    <td>{{ note.id }}</td>

                    <td>
                        {{ note.title }}
                    </td>

                    <td>
                        {{ note.uploaded_by }}
                    </td>

                    <td>
                        {{ note.filename }}
                    </td>

                    <td>
                        <form method="POST"
                              action="{{ url_for('admin_delete_note', note_id=note.id) }}"
                              onsubmit="return confirm('Are you sure you want to delete this note?');">

                            <button type="submit" class="delete-btn">
                                Delete
                            </button>

                        </form>
                    </td>
                </tr>

                {% else %}
                <tr>
                    <td colspan="5" class="empty-message">
                        No notes available.
                    </td>
                </tr>
                {% endfor %}

            </tbody>
        </table>

    </div>

</div>

</body>
</html>
