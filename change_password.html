
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(255, 248, 230, 0.82),
                    rgba(255, 248, 230, 0.82)
                ),
                url("/static/backgroundpic.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: #4b3b2a;
        }

        .container {
            width: 92%;
            max-width: 500px;
            margin: 60px auto;
        }

        .box {
            background: rgba(255, 250, 240, 0.95);
            padding: 35px;
            border-radius: 22px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #5d4933;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #c7b69a;
            border-radius: 10px;

            font-size: 15px;
        }

        /* Password eye icon */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            background: transparent;
            border: none;
            padding: 3px;
            margin: 0;

            color: #5d4933;
            font-size: 19px;
            cursor: pointer;
        }

        button,
        a {
            display: inline-block;

            padding: 11px 18px;

            margin-top: 20px;

            border-radius: 10px;

            border: none;

            text-decoration: none;

            color: white;

            cursor: pointer;
        }

        button[type="submit"] {
            background: #7a6b8f;
        }

        .back {
            background: #8b6f47;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>
            🔐 Change Password
        </h1>

        <form method="POST">

            <label>
                Current Password
            </label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('current_password', this)"
                    aria-label="Show current password"
                >👁</button>
            </div>


            <label>
                New Password
            </label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('new_password', this)"
                    aria-label="Show new password"
                >👁</button>
            </div>


            <label>
                Confirm New Password
            </label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirm_password', this)"
                    aria-label="Show confirm password"
                >👁</button>
            </div>


            <button type="submit">
                🔐 Change Password
            </button>


            <a
                class="back"
                href="{{ url_for('profile') }}"
            >
                ⬅️ Back to Profile
            </a>

        </form>

    </div>

</div>

<script>

    function togglePassword(inputId, button) {

        const password = document.getElementById(inputId);

        if (password.type === "password") {

            password.type = "text";
            button.innerHTML = "🙈";
            button.setAttribute("aria-label", "Hide password");

        } else {

            password.type = "password";
            button.innerHTML = "👁";
            button.setAttribute("aria-label", "Show password");

        }

    }

</script>

</body>

</html>
